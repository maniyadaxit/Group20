openapi: 3.0.3
info:
  title: CampusEats Orders Service API
  description: >
    Production REST API specification for the CampusEats Orders Service.
    Enforces HTTP/1.1 semantics, correct verbs, RFC 7807 problem details,
    conditional caching (ETags, 304), optimistic locking (412),
    idempotent retries, and rate limiting signalling.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://campuseats.univ.edu/api/v1
    description: Production gateway server

paths:
  /orders:
    get:
      summary: List and search orders
      description: >
        Pure read operation (safe and idempotent). Supports filtering, sorting,
        and pagination through the query string.
      parameters:
        - name: student_id
          in: query
          required: false
          schema:
            type: string
          description: Filter orders placed by a specific student.
        - name: vendor_id
          in: query
          required: false
          schema:
            type: string
          description: Filter orders for a specific vendor.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PLACED, CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED]
          description: Filter by order lifecycle status.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: created_at
          description: Field to sort by (created_at, final_amount).
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Page size.
      responses:
        '200':
          description: Paginated list of orders retrieved successfully.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      summary: Place a new order
      description: >
        Non-safe and non-idempotent order creation. Clients MUST provide an
        Authorization header and SHOULD provide an Idempotency-Key header to ensure
        network retries do not result in duplicate charges or orders.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    options:
      summary: Discover allowed methods on /orders
      responses:
        '204':
          description: Options response.
          headers:
            Allow:
              schema:
                type: string
                example: "GET, POST, OPTIONS, HEAD"

  /orders/{order_id}:
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the order.

    get:
      summary: Retrieve order by ID
      description: >
        Safe, idempotent single-resource read. Returns Cache-Control and ETag headers.
        Clients can supply If-None-Match to perform a conditional GET.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Order details retrieved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '304':
          description: Resource has not changed since the provided ETag. No body returned.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    put:
      summary: Update order specifications
      description: >
        Idempotent update. Protects against mid-air collisions via the If-Match header.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/X-HTTP-Method-Override'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      summary: Remove or cancel draft order
      description: >
        Idempotent removal.
      parameters:
        - $ref: '#/components/parameters/Authorization'
      responses:
        '204':
          description: Order removed successfully. No body returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    options:
      summary: Discover allowed methods on single order
      responses:
        '204':
          description: Options response.
          headers:
            Allow:
              schema:
                type: string
                example: "GET, PUT, PATCH, DELETE, OPTIONS, HEAD"

  /orders/{order_id}/cancel:
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the order.

    post:
      summary: Transition order to cancelled status
      description: >
        Non-CRUD sub-resource state change. Cannot cancel an order that is already completed.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order transitioned to CANCELLED successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                  status:
                    type: string
                    example: CANCELLED
                  message:
                    type: string
                  cancelled_at:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        example: "Bearer student_token_jwt"
      description: Bearer authentication token.

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        example: "req_key_9f83a21e"
      description: Unique client key guaranteeing safe retries.

    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        example: '"a1b2c3d4e5f67890"'
      description: Optimistic lock token preventing concurrent overwrite (412 on mismatch).

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        example: '"a1b2c3d4e5f67890"'
      description: Conditional read validator (304 Not Modified if unchanged).

    X-HTTP-Method-Override:
      name: X-HTTP-Method-Override
      in: header
      required: false
      schema:
        type: string
        example: "PUT"
      description: Method override for restricted network firewalls/proxies.

  headers:
    Location:
      description: URI of newly created resource or redirect target.
      schema:
        type: string
        example: "/orders/42"
    ETag:
      description: Entity tag representing current state hash.
      schema:
        type: string
        example: '"a1b2c3d4e5f67890"'
    Cache-Control:
      description: Cache directives for intermediate proxies and client browsers.
      schema:
        type: string
        example: "public, max-age=60, must-revalidate"
    X-RateLimit-Limit:
      description: Maximum permitted requests in budget window.
      schema:
        type: integer
        example: 100
    X-RateLimit-Remaining:
      description: Remaining quota in budget window.
      schema:
        type: integer
        example: 95
    Retry-After:
      description: Seconds client must wait before retrying when throttled.
      schema:
        type: integer
        example: 60

  responses:
    BadRequest:
      description: 400 Bad Request — Malformed syntax or invalid request format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: 401 Unauthorized — Missing or empty Bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: 'Bearer realm="CampusEats", error="invalid_token"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: 404 Not Found — Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotAcceptable:
      description: 406 Not Acceptable — Client requested unsupported MIME type in Accept header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: 409 Conflict — Resource state conflict (e.g. terminal state transition).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: 412 Precondition Failed — Provided If-Match ETag does not match resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: 422 Unprocessable Entity — Domain validation refused request (empty items, invalid drop zone).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: 429 Too Many Requests — Per-client request budget exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    OrderItem:
      type: object
      required: [item_id, quantity, unit_price]
      properties:
        item_id:
          type: string
          example: "item_thali_deluxe"
        name:
          type: string
          example: "Special Veg Thali"
        quantity:
          type: integer
          minimum: 1
          example: 1
        unit_price:
          type: number
          format: float
          example: 90.0

    Order:
      type: object
      properties:
        id:
          type: string
          example: "42"
        student_id:
          type: string
          example: "student_20251651054"
        vendor_id:
          type: string
          example: "vendor_canteen_central"
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: number
          example: 90.0
        discount_amount:
          type: number
          example: 20.0
        final_amount:
          type: number
          example: 70.0
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
          example: PICKUP
        drop_zone:
          type: string
          nullable: true
          example: "Hostel 4 Ground Floor"
        time_slot:
          type: string
          nullable: true
          example: "13:30-14:00"
        coupon_code:
          type: string
          nullable: true
          example: "CAMPUS50"
        payment_method:
          type: string
          enum: [WALLET, UPI, CARD, CASH]
          example: WALLET
        status:
          type: string
          enum: [PLACED, CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED]
          example: PLACED
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2026-10-13T06:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-13T06:00:00Z"

    CreateOrderRequest:
      type: object
      required: [student_id, vendor_id, items]
      properties:
        student_id:
          type: string
          example: "student_20251651054"
        vendor_id:
          type: string
          example: "vendor_canteen_central"
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]
          default: PICKUP
        drop_zone:
          type: string
        time_slot:
          type: string
          example: "13:30-14:00"
        coupon_code:
          type: string
          example: "CAMPUS50"
        payment_method:
          type: string
          enum: [WALLET, UPI, CARD, CASH]
          default: WALLET

    UpdateOrderRequest:
      type: object
      properties:
        drop_zone:
          type: string
          example: "Hostel 3 Wing B"
        time_slot:
          type: string
          example: "14:00-14:30"
        delivery_type:
          type: string
          enum: [PICKUP, DELIVERY]

    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_count:
          type: integer
          example: 25
        has_more:
          type: boolean
          example: true

    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          example: "https://campuseats.univ.edu/errors/bad-request"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Malformed JSON syntax in request body."
