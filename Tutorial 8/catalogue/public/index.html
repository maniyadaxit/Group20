<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CampusEats Catalogue</h1>
  <p class="sub">The menu &mdash; served by a REST API (Node + Express)</p>
  <div id="list">Loading&hellip;</div>

  <form id="addForm">
    <h3>Add a dish</h3>
    <input id="name" placeholder="Dish name" required>
    <input id="price" type="number" placeholder="Price (rupees)">
    <button type="submit">Add dish</button>
  </form>

  <script>
    // escape user text before putting it in innerHTML
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // 1. READ: GET /items, then draw the list
    async function load() {
      const res = await fetch('/items');
      const items = await res.json();
      document.getElementById('list').innerHTML = items.map(i =>
        `<div class="dish"><span class="name">${esc(i.name)}</span>` +
        `<span class="right"><span class="price">&#8377;${esc(i.price)}</span>` +
        `<button class="del" onclick="removeItem(${i.id})">Delete</button></span></div>`
      ).join('');
    }

    // 2. CREATE: POST /items
    document.getElementById('addForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const price = document.getElementById('price').value;
      await fetch('/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price })
      });
      e.target.reset();
      load();
    });

    // 3. DELETE: DELETE /items/:id
    async function removeItem(id) {
      await fetch(`/items/${id}`, { method: 'DELETE' });
      load();
    }

    load();
  </script>
</body>
</html>
